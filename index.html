    <script src="vendor/zlib.pako.js"></script>
    <script>
let utf8Map = {};

async function loadUtf8Map() {
	try {
		const mapFile = document.getElementById('sUTF8map').selectedOptions[0].value;
		const response = await fetch('data/'+mapFile+'.txt');
		const text = await response.text();
		const lines = text.trim().split('\n');
		
		utf8Map = {};
		lines.forEach(line => {
			const parts = line.trim().split(/\s+/);
			if (parts.length === 2) {
				const ascii = parseInt(parts[0], 10);
				const utf8Code = parseInt(parts[1], 10);
				utf8Map[ascii] = String.fromCharCode(utf8Code);
			}
		});
		
		console.log('UTF8 map loaded:', Object.keys(utf8Map).length, 'entries:');
		for (let pairId = 0; pairId < Object.keys(utf8Map).length; pairId++) {
		console.log(pairId, ' ', utf8Map[pairId]);
		}
	} catch (error) {
		console.error('Error loading UTF8 map:', error);
	}
}

function rgb2hex(r, g, b){
    const bbr = r >> 4;
    const bbg = g >> 4;
    const bbb = b >> 4;
	if ((bbr === (r & 15)) && (bbg === (g & 15)) && (bbb === (b & 15))) {
		return `#${(0x1000 | bbr << 8 | bbg << 4 | bbb).toString(16).slice(1)}`
    } else {
        return `#${(0x1000000 | r << 16 | g << 8 | b).toString(16).slice(1)}`
    }
}

function viewXpFile() {
	const fileInput = document.getElementById('fileInput');
	const file = fileInput.files[0];
	const useCSS = document.getElementById('chCSS').checked;
	
	if (!file) {
		alert('Select REXPaint (.xp) file');
		return;
	}
	
	const reader = new FileReader();
	
	reader.onload = function(event) {
		try {
			const arrayBuffer = event.target.result;
			const uint8Array = new Uint8Array(arrayBuffer);

			const colorsFreq = {'': {}, 'background-': {}};
			
			// pako - MIT License
			// https://github.com/nodeca/pako
			// (c) 2014-2017 Vitaly Puzrin, Andrei Tuputcyn
			const decompressed = pako.inflate(uint8Array);	// Unzip with zlib
			const dataView = new DataView(decompressed.buffer);
			
			let offset = 0;
			
			const version = dataView.getInt32(offset, true);
			offset += 4;
			
			const numLayers = dataView.getInt32(offset, true);
			offset += 4;
			
			const layers = [];
			let width, height;
			
			for (let layerIdx = 0; layerIdx < numLayers; layerIdx++) {
				width = dataView.getInt32(offset, true);
				offset += 4;
				
				height = dataView.getInt32(offset, true);
				offset += 4;
				const cells = [];

				// XXX: It might be worth replacing the two loops with one. charIndex < width * height
				for (let y = 0; y < width; y++) {
					for (let x = 0; x < height; x++) {
						const ascii = dataView.getInt32(offset, true);
						offset += 4;
						
						const fgRed = dataView.getUint8(offset);
						offset += 1;
						const fgGreen = dataView.getUint8(offset);
						offset += 1;
						const fgBlue = dataView.getUint8(offset);
						offset += 1;
						
						const bgRed = dataView.getUint8(offset);
						offset += 1;
						const bgGreen = dataView.getUint8(offset);
						offset += 1;
						const bgBlue = dataView.getUint8(offset);
						offset += 1;
						
						const char = utf8Map[ascii] || String.fromCharCode(ascii);
						
						const fg = rgb2hex(fgRed, fgGreen, fgBlue);
						const bg = rgb2hex(bgRed, bgGreen, bgBlue);
						
						cells.push({
							ascii: ascii,
							char: char,
							fg: fg,
							bg: bg,
							isTransparent: bgRed === 255 && bgGreen === 0 && bgBlue === 255
						});
					}
				}
				layers.push(cells);
			}
			
			const composited = [];
			for (let index = 0; index < width * height; index++) {
				let layerIndex = numLayers - 1;
				let cell = layers[layerIndex][index];
				while (cell.isTransparent && layerIndex > 0) {
					layerIndex--;
					cell = layers[layerIndex][index];
				}
				composited.push(cell);
			}

			const bColor = '#000';
			const preCSS = 'background:' + bColor + ';overflow:auto;';
			const runs = [];
			let run = null;

			// Count color changes in the rendered spans, not the number of cells using a color.
			for (let y = 0; y < height; y++) {
				for (let x = 0; x < width; x++) {
					const cell = composited[x * height + y];
					const char = cell.isTransparent || cell.ascii === 32 ? ' ' : escapeHtml(cell.char);
					const bg = cell.isTransparent ? bColor : cell.bg;
					const fg = char === ' ' ? (run && run.bg === bg ? run.fg : null) : cell.fg;

					if (!run || run.fg !== fg || run.bg !== bg) {
						run = {fg: fg, bg: bg, text: ''};
						runs.push(run);
						if (fg !== null) colorsFreq[''][fg] = (colorsFreq[''][fg] || 0) + 1;
						if (bg !== bColor) colorsFreq['background-'][bg] = (colorsFreq['background-'][bg] || 0) + 1;
					}
					run.text += char;
				}
				if (run) run.text += '\n';
			}

			const colorClasses = {'': {}, 'background-': {}};
			let css = '<style>.rex{' + preCSS + '}';
			if (useCSS) {
				for (const planKey of Object.keys(colorsFreq)) {
					let classIndex = 0;
					for (const color of Object.keys(colorsFreq[planKey])) {
						if (colorsFreq[planKey][color] > 1) {
							const className = (planKey ? 'b' : 'f') + (classIndex++).toString(16);
							colorClasses[planKey][color] = className;
							css += '.rex .' + className + '{' + planKey + 'color:' + color + ';}';
						}
					}
				}
			}

			let html = useCSS ? '<pre class="rex">' : '<pre style="' + preCSS + '">';
			for (const segment of runs) {
				const classes = [];
				const styles = [];
				if (segment.fg !== null) {
					const className = colorClasses[''][segment.fg];
					if (className) classes.push(className);
					else styles.push('color:' + segment.fg);
				}
				if (segment.bg !== bColor) {
					const className = colorClasses['background-'][segment.bg];
					if (className) classes.push(className);
					else styles.push('background-color:' + segment.bg);
				}
				if (classes.length || styles.length) {
					html += '<span' + (classes.length ? ' class="' + classes.join(' ') + '"' : '')
						+ (styles.length ? ' style="' + styles.join(';') + ';"' : '') + '>' + segment.text + '</span>';
				} else {
					html += segment.text;
				}
			}
			html += '</pre>';
			if (useCSS) html = css + '</style>\n' + html;
			const outputTA = document.getElementById('srcHTML');
			outputTA.value = html;
			
			document.getElementById('bytes').textContent = html.length;
			
			// Post-view information
			html += '<pre>Info:\n';
			html += 'Version: ' + version + '\n';
			html += 'Layers: ' + numLayers + '\n';
			html += 'Resolution: ' + width + ' x ' + height + '</pre>';
			
			const outputDiv = document.getElementById('output')
			outputDiv.innerHTML = html;
			
			
		} catch (error) {
			document.getElementById('output').innerHTML = 
				'<p style="color:red;">Error: ' + error.message + '</p>';
			console.error(error);
		}
	};
	
	reader.readAsArrayBuffer(file);
}

function escapeHtml(text) {
	const div = document.createElement('div');
	div.textContent = text;
	return div.innerHTML;
}

document.getElementById('srcHTML').value = '';
document.getElementById("sUTF8map").onchange = changeSelect;

function changeFile(){
  var curFiles = input.files;
  if (curFiles.length === 0) {
    var para = document.createElement("p");
    para.textContent = "No files currently selected for upload";
    preview.appendChild(para);
  } else {
  
  }
}

document.getElementById('fileInput').addEventListener('change', function () {
  const fileName = document.getElementById('fileName');
  if (this.files && this.files.length > 0) {
    fileName.textContent = this.files[0].name;
    fileName.classList.add('has-file');
  } else {
    fileName.textContent = 'File not selected';
    fileName.classList.remove('has-file');
  }
});

function changeSelect(){loadUtf8Map();}
loadUtf8Map();
    </script>
